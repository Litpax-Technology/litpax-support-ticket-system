<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Service Request — Litpax Support</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .success-card {
      display: none;
      text-align: center;
      padding: 40px 28px;
    }
    .success-card .tick {
      font-size: 56px;
      margin-bottom: 16px;
    }
    .success-card h2 {
      font-size: 22px;
      font-weight: 900;
      color: #0f172a;
      margin-bottom: 8px;
    }
    .success-card p {
      color: #64748b;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .success-card .ticket-id-badge {
      display: inline-block;
      background: #f0fdf4;
      border: 1.5px solid #86efac;
      color: #15803d;
      font-size: 20px;
      font-weight: 900;
      padding: 10px 28px;
      border-radius: 999px;
      margin-bottom: 32px;
      letter-spacing: 1px;
    }
    .success-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .success-actions a {
      flex: 1;
      min-width: 160px;
      padding: 16px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 900;
      text-decoration: none;
      text-align: center;
      transition: .25s ease;
    }
    .success-actions a:hover { transform: translateY(-2px); }
    .btn-update {
      background: linear-gradient(135deg,#0f172a,#1e3a8a);
      color: #fff !important;
      box-shadow: 0 10px 24px rgba(30,58,138,.25);
    }
    .btn-new {
      background: linear-gradient(135deg,#14532d,#15803d);
      color: #fff !important;
      box-shadow: 0 10px 24px rgba(21,128,61,.2);
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div class="form-card">
      <div class="form-header">
        <div>
          <h1>Service Support Request</h1>
          <p>Raise technician support ticket for field battery repairing assistance</p>
        </div>
        <span>Litpax Support</span>
      </div>

      <!-- Form -->
      <form id="supportForm">
        <div class="section-title">Technician Details</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Technician Name</label>
            <input type="text" name="technicianName" required />
          </div>
          <div class="form-group">
            <label>Technician Mobile</label>
            <input type="tel" name="technicianMobile" required />
          </div>
        </div>

        <div class="section-title">Customer Details</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" name="customerName" required />
          </div>
          <div class="form-group">
            <label>Customer Mobile</label>
            <input type="tel" name="customerMobile" required />
          </div>
          <div class="form-group full">
            <label>Customer Location</label>
            <input type="text" name="location" required />
          </div>
        </div>

        <div class="section-title">Battery Details</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Battery Model</label>
            <input type="text" name="batteryModel" required />
          </div>
          <div class="form-group">
            <label>Battery Serial Number</label>
            <input type="text" name="serialNumber" required />
          </div>
        </div>

        <div class="section-title">Problem Details</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Problem Type</label>
            <select name="problemType" required>
              <option value="">Select Problem Type</option>
              <option value="Battery Not Charging">Battery Not Charging</option>
              <option value="Low Backup">Low Backup</option>
              <option value="BMS Issue">BMS Issue</option>
              <option value="Cell Issue">Cell Issue</option>
              <option value="Connector Issue">Connector Issue</option>
              <option value="Charger Issue">Charger Issue</option>
              <option value="Wiring Issue">Wiring Issue</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select name="priority" required>
              <option value="">Select Priority</option>
              <option value="Normal">Normal</option>
              <option value="Urgent">Urgent</option>
              <option value="Emergency">Emergency</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Problem Details</label>
            <textarea name="problemDetails" rows="4" required></textarea>
          </div>
        </div>

        <button type="submit" id="submitBtn">Submit Support Ticket</button>
        <div id="errorBox" style="margin-top:14px;padding:14px;border-radius:14px;font-size:14px;font-weight:700;display:none;background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;"></div>
      </form>

      <!-- Success Card (hidden until submit) -->
      <div class="success-card" id="successCard">
        <div class="tick">✅</div>
        <h2>Ticket Created Successfully!</h2>
        <p>Your service ticket has been raised.</p>
        <div class="ticket-id-badge" id="ticketIdDisplay"></div>
        <div class="success-actions">
          <a id="updateLink" href="#" class="btn-update">✏️ Update This Ticket</a>
          <a href="update.html" class="btn-new">➕ Create New Ticket</a>
        </div>
      </div>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwL58wSLfqUc8wqTLmVoP0iJhgN64U2YkVrB-J7P4eMikxR50MmlK6yv2NoRaFRyVc3/exec";
    const form      = document.getElementById("supportForm");
    const submitBtn = document.getElementById("submitBtn");
    const errorBox  = document.getElementById("errorBox");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      submitBtn.disabled  = true;
      submitBtn.innerText = "Submitting...";
      errorBox.style.display = "none";

      const data = {
        technicianName:   form.technicianName.value.trim(),
        technicianMobile: form.technicianMobile.value.trim(),
        customerName:     form.customerName.value.trim(),
        customerMobile:   form.customerMobile.value.trim(),
        location:         form.location.value.trim(),
        batteryModel:     form.batteryModel.value.trim(),
        serialNumber:     form.serialNumber.value.trim(),
        problemType:      form.problemType.value,
        problemDetails:   form.problemDetails.value.trim(),
        priority:         form.priority.value,
        travelExpense:    0,
        foodExpense:      0,
        partsExpense:     0,
        otherExpense:     0,
        totalExpense:     0
      };

      try {
        const res    = await fetch(API_URL, { method: "POST", body: JSON.stringify(data) });
        const result = await res.json();
        if (result.success) {
          // Hide form, show success card
          form.style.display = "none";
          document.querySelector(".form-header").style.display = "none";
          document.getElementById("ticketIdDisplay").innerText = result.ticketId;
          document.getElementById("updateLink").href = "index.html?id=" + result.ticketId;
          document.getElementById("successCard").style.display = "block";
        } else {
          throw new Error(result.message || "Something went wrong");
        }
      } catch(error) {
        errorBox.style.display = "block";
        errorBox.innerText = "Error: " + error.message;
      }

      submitBtn.disabled  = false;
      submitBtn.innerText = "Submit Support Ticket";
    });
  </script>
</body>
</html>
